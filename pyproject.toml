[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guoling-zhushou"
version = "1.3.3"
description = "GuoLingZhuShou desktop utility for QQ SG task OCR"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "paddleocr>=2.7,<3.0",
  "paddlepaddle==2.6.2",
  "Pillow>=10.0",
  "keyboard>=0.13.5",
  "pywin32>=306",
  "windows-capture==2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guoling_task_ocr = ["data/*.json"]
